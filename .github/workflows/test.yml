name: Permission lifecycle tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test reference behaviour and deliberate failures
        run: npm test
      - name: Produce model evidence
        run: node bin/permission-lab.cjs run --adapter atomic --format json --output evidence/atomic.json
      - name: Produce database evidence
        if: always()
        run: node bin/permission-lab.cjs run --adapter sqlite --format junit --output evidence/sqlite.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: permission-evidence-node-${{ matrix.node }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
